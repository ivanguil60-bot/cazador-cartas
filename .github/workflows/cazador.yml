name: Cazador de cartas
# Cada ejecución mira Wallapop cada 3 min durante ~50 min, guarda el estado en el repo y lanza la siguiente.
# El cron horario es solo el respaldo por si la cadena se corta.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "normal: cazar ~50 min · prueba: solo comprobar que se llega a Wallapop (no envía nada)"
        type: choice
        options: [normal, prueba]
        default: normal
permissions:
  contents: write
  actions: write
concurrency:
  group: cazador
  cancel-in-progress: false
jobs:
  cazar:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    env:
      NTFY_TEMA: ${{ secrets.NTFY_TEMA }}
      TZ: Europe/Madrid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prueba (no envía ni guarda)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.modo == 'prueba' }}
        run: python -I cazador.py --prueba
      - name: Cazar
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.modo == 'prueba') }}
        run: python -I nube_bucle.py
      - name: Guardar estado
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.modo == 'prueba') }}
        run: |
          git config user.name "cazador-bot"
          git config user.email "cazador-bot@users.noreply.github.com"
          git add estado/
          git diff --cached --quiet || git commit -q -m "estado $(date '+%d/%m %H:%M')"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
      - name: Lanzar la siguiente
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.modo == 'prueba') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cazador.yml -f modo=normal
